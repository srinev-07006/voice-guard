<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceGuard | Authentication</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background: #000000;
            color: white;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .gradient-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.15) 0%, rgba(0,0,0,1) 50%);
            z-index: -1;
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(55, 65, 81, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .gradient-text {
            background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }

        /* Toggle animation helper */
        .hidden-mode {
            display: none;
        }
    </style>
</head>
<body>

    <div class="gradient-bg"></div>

    <div class="glass-card rounded-2xl w-full max-w-md p-8 sm:p-10 mx-4 relative overflow-hidden">

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-green-500 rounded-xl flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-shield-halved text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold mb-1"><span class="gradient-text">VoiceGuard</span></h1>
            <p class="text-gray-400 text-sm" id="subtitle-text">Sign in to access your dashboard</p>
        </div>

        <!-- Alerts -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

        <!-- Form -->
        <form id="auth-form" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-envelope text-gray-500"></i>
                    </div>
                    <input type="email" id="email" required
                        class="w-full pl-10 pr-3 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-white placeholder-gray-500 transition"
                        placeholder="you@company.com">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-500"></i>
                    </div>
                    <input type="password" id="password" required minlength="6"
                        class="w-full pl-10 pr-3 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-white placeholder-gray-500 transition"
                        placeholder="••••••••">
                </div>
            </div>

            <!-- Additional fields for Sign Up mode -->
            <div id="signup-extra-fields" class="hidden-mode">
                <label for="passwordConfirm" class="block text-sm font-medium text-gray-300 mb-1">Confirm Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-500"></i>
                    </div>
                    <input type="password" id="passwordConfirm" minlength="6"
                        class="w-full pl-10 pr-3 py-2 bg-gray-800 border border-gray-700 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-white placeholder-gray-500 transition"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full btn-primary text-white font-semibold py-2.5 rounded-lg mt-6 flex justify-center items-center">
                <span id="btn-text">Sign In</span>
                <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin ml-2 hidden"></i>
            </button>
        </form>

        <!-- Toggle UI -->
        <div class="mt-6 text-center text-sm text-gray-400">
            <span id="toggle-prompt">Don't have an account?</span>
            <button id="toggle-mode-btn" class="text-blue-400 hover:text-blue-300 font-medium ml-1 outline-none">
                Sign Up
            </button>
        </div>
    </div>

    <!-- Auth Logic -->
    <script>
        // Supabase Initialization
        // TODO: Replace with your actual Supabase URL and Anon Key
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // State
        let isSignUpMode = false;

        // DOM Elements
        const authForm = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const passwordConfirmInput = document.getElementById('passwordConfirm');
        const signupExtraFields = document.getElementById('signup-extra-fields');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const toggleModeBtn = document.getElementById('toggle-mode-btn');
        const togglePrompt = document.getElementById('toggle-prompt');
        const subtitleText = document.getElementById('subtitle-text');
        const alertBox = document.getElementById('alert-box');

        // Check if user is already logged in
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        }

        // Call it immediately
        checkSession();

        // UI Toggle Logic
        toggleModeBtn.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;

            // Reset fields and alerts
            authForm.reset();
            hideAlert();

            if (isSignUpMode) {
                // Switch to Sign Up UI
                subtitleText.textContent = 'Create your account to get started';
                btnText.textContent = 'Sign Up';
                togglePrompt.textContent = 'Already have an account?';
                toggleModeBtn.textContent = 'Sign In';
                signupExtraFields.classList.remove('hidden-mode');
                passwordConfirmInput.setAttribute('required', 'true');
            } else {
                // Switch to Sign In UI
                subtitleText.textContent = 'Sign in to access your dashboard';
                btnText.textContent = 'Sign In';
                togglePrompt.textContent = "Don't have an account?";
                toggleModeBtn.textContent = 'Sign Up';
                signupExtraFields.classList.add('hidden-mode');
                passwordConfirmInput.removeAttribute('required');
            }
        });

        // Form Submit handler
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (isSignUpMode) {
                const confPassword = passwordConfirmInput.value;
                if (password !== confPassword) {
                    showAlert('Passwords do not match.', 'error');
                    return;
                }
            }

            setLoading(true);

            try {
                if (isSignUpMode) {
                    // Execute Sign Up
                    const { data, error } = await supabase.auth.signUp({
                        email: email,
                        password: password,
                    });

                    if (error) throw error;

                    if (data.user && data.user.identities && data.user.identities.length === 0) {
                         showAlert('Email already taken. Please sign in.', 'error');
                    } else if (data.session) {
                         // Auto logged in
                         window.location.href = 'dashboard.html';
                    } else {
                         // Requires email verification based on Supabase settings
                         showAlert('Signup successful! Please check your email to verify.', 'success');
                         // Switch back to signin mode
                         toggleModeBtn.click();
                    }

                } else {
                    // Execute Sign In
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });

                    if (error) throw error;

                    if (data.session) {
                        window.location.href = 'dashboard.html';
                    }
                }
            } catch (error) {
                showAlert(error.message, 'error');
            } finally {
                setLoading(false);
            }
        });

        // Utility: Show Alert
        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.classList.remove('hidden', 'bg-red-900', 'text-red-200', 'bg-green-900', 'text-green-200');

            if (type === 'error') {
                alertBox.classList.add('bg-red-900', 'bg-opacity-50', 'text-red-200', 'border', 'border-red-800');
            } else if (type === 'success') {
                alertBox.classList.add('bg-green-900', 'bg-opacity-50', 'text-green-200', 'border', 'border-green-800');
            }
        }

        // Utility: Hide Alert
        function hideAlert() {
            alertBox.classList.add('hidden');
        }

        // Utility: Set Loading State
        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.setAttribute('disabled', 'true');
                btnSpinner.classList.remove('hidden');
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            } else {
                submitBtn.removeAttribute('disabled');
                btnSpinner.classList.add('hidden');
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
